# Propriedades de configuração de acesso ao banco de dados por JDBC
spring.datasource.url=jdbc:postgresql://localhost:5432/gestDoc
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
#spring.datasource.password=manager
spring.datasource.password=menachinho
#server.port=7050

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Thymeleaf
spring.thymeleaf.mode=html
spring.thymeleaf.cache=false
spring.thymeleaf.template-resolver-order=0

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate = true

#Application
app.assets=http://localhost:8080/resources/
app.dominio=http://localhost:8080


<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>GestDoc | Usuario</title>
</head>
<header th:insert="admin/template-header.html"> </header>
	<div class="content-fluid">    
    	<div class="content-header">
      		<div class="container">
        		<div class="row mb-2">
          			<div class="col-sm-6">
            			<h1 style="font-weight:900;text-transform:uppercase;" class="m-0 text-dark"> Listar Grupos. </h1>
          			</div>
          			<div class="col-sm-6">
          			</div>
        		</div>
      		</div>
    	</div>
    	<div class="content">
      		<div class="container">
        		<div class="row">
          			<div class="col-lg-12">
          				<div style="border-left:8px solid #023160;" class="card">
              				<div class="card-header">
                  				<h2 style="text-transform: uppercase;font-size:20px;color: #1b88f6;font-weight: 600;"> informações do Grupo </h2>
                			</div>
              				<div class="card-body">
		                	<input class="form-control" id="myInput" type="text" placeholder="Busque por campos visíveis abaixo"><br>
		                	<table class="table table-bordered table-striped">
                    			<thead>
	                      			<tr>
	                        			<th>Nome</th>
	                      				<th>Ações</th>
	                      			</tr>
                    			</thead>
                    			<tbody id="myTable">
                    				 <tr th:if="${grupos.empty}"> 
                    				 	<td colspan="2" >Nenhum grupo cadastrado</td>
                    				 </tr>
			                         <tr th:each="grupo : ${grupos}"> 
			                         	<td> <span th:text="${grupo.nome}"></span></td>
		                        		<td> 
		                            		<a class="btn btn-primary btn-sm" title="Editar Grupo" type="button" th:href="@{'/admin/grupo/' + ${grupo.id}}">
		                            		<i class="fa fa-edit"></i></a> 
		                       			</td>
			                         </tr>
                    			</tbody>
                  			</table>              
              				</div>
            			</div><br>
					</div>
        		</div>
      		</div><hr>
      		<div class="card-body">
      			<a th:href="@{/admin/grupo/}" class="button" > <i class="fa fa-plus"> </i> Novo Grupo </a>
      		</div>
		</div>

  	</div>
    <div th:insert="admin/template-footer.html"> </div>
<script>
$(document).ready(function(){
  $("#myInput").on("keyup", function() {
    var value = $(this).val().toLowerCase();
    $("#myTable tr").filter(function() {
      $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
    });
  });
});
</script>	
</body>
</html>

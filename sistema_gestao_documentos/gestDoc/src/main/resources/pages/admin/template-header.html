<style>
.buttao{
	float:left;
	margin-right:2px;
	background-color: #026a2d;
	color:white;
	height: 40px;
	line-height: 40px;
	padding: 0 30px;
	font-weight: bold;

	text-transform:uppercase;
	border-width: 0 4px 5px 0;
	border-radius: 5px;
	border-color: transparent rgb(0, 169, 0) rgb(0, 169, 0) transparent;

}

.buttao:hover{
	border-width: 0 2px 3px 0;

	left: 2px;
	top: 3px;
	color:white;
}

	list-style-type: none;

	padding: 0;
	overflow: hidden;
	background-color: #001225;
}

li {
	float: left;
}

li a {
	display: block;
  	color: white;
  	text-align: center;
  	padding: 14px 16px;
  	text-decoration: none;
  	font-weight:700;
  	text-transform:uppercase;
}

/* Change the link color to #111 (black) on hover */

  	background-color: #ddd;
}

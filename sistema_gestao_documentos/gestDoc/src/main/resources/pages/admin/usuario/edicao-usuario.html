<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<header th:insert="admin/template-header.html"> </header>
<div class="content-fluid">
    <div class="content-header">
      <div class="container">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 style="font-weight:900;text-transform:uppercase;" class="m-0 text-dark"> Actualizar Usuário </h1>
          </div>
          <div class="col-sm-6">    
          </div>
        </div>
      </div>
    </div>
    <form method="post" >
    <input type="hidden" name="id" th:value="${usuario?.id}">
    <div class="content">
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div style="border-left:8px solid #023160;" class="card">
              <div class="card-header">
                  <h2 style="text-transform: uppercase;font-size:20px;color: #1b88f6;font-weight: 600;"> Informações do Usuário</h2>
              </div>
              <div class="card-body">
				  <div class="form-row">
					  <div class="col-lg-12">
						  <tr> 
                      		<td> <label style="color:#777;font-weight: 400;"> Nome </label></td>
                      		<td> <input name="nome" type="text" placeholder="Nome do Usuário" class="form-control" th:value="${usuario?.nome}"/></td>
                          </tr>
						</div>
				        <div class="col-lg-6">  <br>
				        <div class="text-danger" th:if="${erros?.hasFieldErrors('email')}"><span th:text="${erros?.getFieldError('email').getDefaultMessage()}"/></div>
					  	  <tr> 
                      		<td> <label style="color:#777;font-weight: 400;"> Email </label></td>
                      		<td> <input name="email" type="email" placeholder="Email do Usuário" class="form-control" th:value="${usuario?.email}"/></td>
                          </tr>
				        </div>
				        <div class="col-lg-6"> <br>
					  	  <tr> 
                      		<td> <label style="color:#777;font-weight: 400;"> Data de Nascimento </label></td>
                      		<td> <input name="dataNascimento" type="date" placeholder="Email do Usuário" class="form-control" th:value="${usuario?.dataNascimento}"/></td>
                          </tr>
				        </div>
				        <div class="col-lg-6"> <br>
							<!--<tr> 
                    			<td> <label style="color:#777;font-weight: 400;"> Genero do Usuário</label></td>
                    			<td> 
                      				<select id="sexo" name="sexo" class="form-control"> 
                         				<option th:value="${usuario?.sexo}" th:selected="${usuario?.sexo}">Masculino</option>	
                         				<option th:value="${sexo}" th:selected="${usuario?.sexo}">Femenino</option>	
                      				</select>
                    			</td>
                  			</tr>-->
                  			<tr> 
                    			<td> <label style="color:#777;font-weight: 400;"> Genero do Usuário</label></td> <br>
                    			<td> 
                      				<input type="radio" id="sexo" name="sexo" value="M"> Masculino <br>
                      				<input type="radio" id="sexo" name="sexo" value="F"> Femenino
                    			</td>
                  			</tr>
						</div>
				   </div>
                 </div>
                </div>
                <br>
              </div>
          </div>
      </div>
      <hr>
      <div class="card-body">
        <button style="text-transform: uppercase;font-size: 20px;font-weight: 600; letter-spacing: 1px; line-height: none;" class="buttao" type="submit">  Salvar </button>
      </div>
    </div>
  </form>
</div>
<div th:insert="admin/template-footer.html"> </div>
</body>
<script>
$(function(){
   	$('#permissoes').select2({
    	multiple:true,
   	});
})
</script>
</html>

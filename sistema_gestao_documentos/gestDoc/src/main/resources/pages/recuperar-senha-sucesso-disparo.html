<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title> Gest Docs</title>
 	<meta charset="utf-8">
  	<meta content="width=device-width, initial-scale=1.0" name="viewport">
  	<meta content="" name="description">
  	<meta content="" name="keywords">
  	<link th:href="@{/content/imagens/apple-touch-icon.png}" rel="apple-touch-icon">
  	<link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Jost:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  	<link th:href="@{/content/plugins/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  	<link th:href="@{/content/estilos/login-style.css}" rel="stylesheet">


	<style media="screen">
	
	*,
	*:before,
	*:after{
	    padding: 0;
	    margin: 0;
	    box-sizing: border-box;
	}
	
	.popup{
	    background-color: #f1f1f1;
	    width: 400px;
	    padding: 30px 40px;
	    position: absolute;
	    transform: translate(-50%,-50%);
	    left: 50%;
	    top: 50%;
	    border-radius: 8px;
	    font-family: "Poppins",sans-serif;
	    display: none; 
	    text-align: center;
	border-top:4px solid #0e6ad9;
	border-bottom:4px solid #0e6ad9;
	
	}
	.popup button{
	    display: block;
	    margin:  0 0 20px auto;
	    background-color: transparent;
	    font-size: 30px;
	    color: #ffffff;
			background: #0e6ad9;
			border-radius: 100%;
			width: 40px;
			height: 40px;
	    border: none;
	    outline: none;
	    cursor: pointer;
	}
	.popup h2{
		margin-top: -20px;
	}
	.popup p{
	    font-size: 14px;
	    text-align: justify;
	    margin: 20px 0;
	    line-height: 25px;
	}
	  
	</style>
</head>

<body style="overflow-y: hidden;">
  <header id="header" class="fixed-top ">
    <div class="container d-flex align-items-center">
      <h1 class="logo me-auto"> 
        <a href=""><img style="max-height:50px;" th:src="@{/content/imagens/Osva.png}"></a>
      </h1>
	</div>
  </header>

  <section id="hero" class="d-flex align-items-center">
    <div class="container">
      <div class="row">
        <div class="col-lg-6 d-flex flex-column justify-content-center pt-4 pt-lg-0 order-2 order-lg-1" data-aos="fade-up" data-aos-delay="200">
          <h1 class="animate-charcter" style="font-weight:900;font-size:45px;text-transform:uppercase;"> Você receberá um e-mail para redefinir sua senha</h1>          
          <div class="d-flex justify-content-center justify-content-lg-start">
            <a th:href="@{/login}" style="text-transform:uppercase;font-weight:800;" class="btn-get-started scrollto"><i class='bx bxs-user'></i> Acessar  </a>           
          </div>
        </div>
        <div class="col-lg-6 order-1 order-lg-2 hero-img" data-aos="zoom-in" data-aos-delay="200">
          <img th:src="@{/content/imagens/2.png}" class="img-fluid animated" alt="">
        </div>
      </div>
    </div>
      
  </section>

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>  
  <script type="text/javascript" th:src="@{/content/plugins/aos/aos.js}"></script>
  <script type="text/javascript" th:src="@{/content/plugins/bootstrap/js/bootstrap.min.js}"></script>
  <script type="text/javascript" th:src="@{/content/plugins/glightbox/js/glightbox.min.js}"></script>
  <script type="text/javascript" th:src="@{/content/plugins/swiper/swiper-bundle.min.js}"></script>
  <script type="text/javascript" th:src="@{/content/plugins/main.js}"></script>
  <script type="text/javascript" th:src="@{/content/plugins/jquery/jquery.min.js}"></script>
</body>
</html>
